services:
  - type: web
    name: expertmind-backend
    env: python
    region: oregon
    plan: free
    
    # Build command
    buildCommand: |
      pip install -r requirements.txt
    
    # Start command
    startCommand: |
      python run_backend.py
    
    # Health check
    healthCheckPath: /health
    healthCheckInterval: 300
    
    # Environment variables
    envVars:
      - key: GEMINI_API_KEY
        scope: build,runtime
        sync: false
      
      - key: MODEL
        value: "gemini-2.5-flash"
      
      - key: LIVE_MODEL
        value: "gemini-3.1-flash-live-preview"
      
      - key: DATABASE_URL
        scope: build,runtime
        sync: false
      
      - key: FRONTEND_URL
        value: "https://expertmind.netlify.app"
      
      - key: ENVIRONMENT
        value: "production"

databases:
  - name: expertmind-db
    databaseName: expertmind
    user: postgres
    plan: free
